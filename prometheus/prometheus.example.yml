global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot / Micrometer (from host)
  - job_name: spring-actuator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # Generic HTTP metrics (Prometheus client libraries)
  - job_name: http-metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics

  # Redpanda (when devops-starter is on network platform-dev)
  - job_name: redpanda
    static_configs:
      - targets: ["dcb-redpanda:9644"]
