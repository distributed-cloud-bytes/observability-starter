groups:
  - name: http.golden_signals
    rules:
      - alert: HighHttp5xxRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-6)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx rate above 5%
          description: More than 5% of requests returned 5xx over 5 minutes.

      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High HTTP request latency (p99)
